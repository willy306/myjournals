<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyJournals</title>
<style>
:root{--bg:#faf6ef;--surface:#fff;--ink:#2a2118;--muted:#7a6d5e;--accent:#b4572b;--line:#e8dfd0;--shadow:0 8px 30px rgba(60,40,20,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16120e;--surface:#211b15;--ink:#f1e8da;--muted:#a89a88;--accent:#e08a5b;--line:#35291f;--shadow:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16120e;--surface:#211b15;--ink:#f1e8da;--muted:#a89a88;--accent:#e08a5b;--line:#35291f;--shadow:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Georgia,"Times New Roman",serif}
header{text-align:center;padding:64px 20px 36px;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--accent) 18%,transparent),transparent 65%)}
h1{font-size:clamp(2.4rem,7vw,4rem);margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent);font-style:italic}
header p{color:var(--muted);max-width:520px;margin:12px auto 0}
main{max-width:1000px;margin:0 auto;padding:10px 20px 60px}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 24px}
input,textarea,button{font:inherit}
input[type=search],input[type=text],input[type=date],textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.bar input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--accent)}
.card h3{margin:0;font-size:1.25rem}.card time{color:var(--muted);font-size:.85rem;font-family:system-ui,sans-serif}
.card p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:9px;padding:9px 16px;background:var(--accent);color:#fff;font-family:system-ui,sans-serif;font-size:.9rem}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:transparent;color:#c0392b;border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{text-align:center;color:var(--muted);font:.85rem system-ui,sans-serif;padding:20px 20px 40px}
footer a{color:var(--muted);cursor:pointer;text-decoration:underline}
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(960px,96vw);height:min(88vh,900px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px}
.dh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{width:100%;height:calc(100% - 58px);border:0}
.panel{background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:22px;margin-bottom:28px;display:grid;gap:12px}
.panel h2{margin:0;font-size:1.2rem}.note{color:var(--muted);font:.85rem system-ui,sans-serif}
.lock{max-width:440px;margin:0 auto 28px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.chip{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cv{width:calc(100% + 44px);margin:-22px -22px 6px;height:150px;object-fit:cover;border-radius:10px 10px 0 0;max-width:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>My<span>Journals</span></h1>
  <p>A quiet place to read my writing. Browse, read online, or download any journal as a PDF.</p>
</header>
<main>
  <div id="admin"></div>
  <div class="bar"><input type="search" id="q" placeholder="Search journals…" aria-label="Search journals"></div>
  <div id="chips" class="chips"></div><div id="list" class="grid"></div>
</main>
<footer>© MyJournals · Read-only for visitors · <a id="themeLink">Theme</a> · <a id="adminLink">Admin</a></footer>
<dialog id="viewer"><div class="dh"><b id="vt"></b><span class="row" style="margin:0"><button id="vd">Download PDF</button><button class="alt" id="vc">Close</button></span></div><iframe id="vf" title="Journal PDF"></iframe></dialog>
<div id="app"></div>

<script type="application/json" id="data">[]</script>
<script>
(function(){
const MAX_FILE=5*1024*1024, MAX_TOTAL=12*1024*1024;
let journals=[];
try{journals=JSON.parse(document.getElementById('data').textContent)||[]}catch(e){}
const $=id=>document.getElementById(id);
let cat='',isAdmin=false, artifact=null, downloads=null, blobUrl=null, current=null;

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML.replace(/"/g,'&quot;')}
function toBlob(b64){const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:'application/pdf'})}

function render(){
  const q=$('q').value.toLowerCase();
  const cats=[...new Set(journals.map(j=>j.cat).filter(Boolean))];
  if(cat&&!cats.includes(cat))cat='';
  $('chips').innerHTML=cats.length?['All',...cats].map(c=>`<button class="chip${(c==='All'?!cat:c===cat)?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join(''):'';
  const items=journals.filter(j=>(!cat||j.cat===cat)&&(j.title+' '+j.desc).toLowerCase().includes(q));
  const L=$('list');
  if(!items.length){L.innerHTML='<div class="empty" style="grid-column:1/-1">'+(journals.length?'No journals match your search.':'No journals published yet. Please check back soon.')+'</div>';return}
  L.innerHTML=items.map(j=>`<article class="card">${j.cover?`<img class="cv" src="${esc(j.cover)}" alt="">`:''}<time>${esc(j.date||'')}${j.cat?' · '+esc(j.cat):''}</time><h3>${esc(j.title)}</h3><p>${esc(j.desc||'')}</p><div class="row"><button data-r="${j.id}">Read</button><button class="alt" data-d="${j.id}">Download PDF</button>${isAdmin?`<button class="del" data-x="${j.id}">Delete</button>`:''}</div></article>`).join('');
}
$('q').addEventListener('input',render);
$('chips').addEventListener('click',e=>{const c=e.target.dataset.c;if(c!==undefined){cat=c==='All'?'':c;render()}});
$('themeLink').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
$('list').addEventListener('click',e=>{
  const r=e.target.dataset.r,d=e.target.dataset.d,x=e.target.dataset.x;
  if(r)openJ(r);if(d)dl(d);if(x&&isAdmin&&confirm('Delete this journal permanently?')){journals=journals.filter(j=>j.id!==x);save()}
});

function openJ(id){
  current=journals.find(j=>j.id===id);if(!current)return;
  if(blobUrl)URL.revokeObjectURL(blobUrl);
  blobUrl=URL.createObjectURL(toBlob(current.pdf));
  $('vt').textContent=current.title;$('vf').src=blobUrl;$('viewer').showModal();
}
$('vc').onclick=()=>{$('viewer').close();$('vf').src='about:blank'};
$('vd').onclick=()=>current&&dl(current.id);
async function dl(id){
  const j=journals.find(x=>x.id===id);if(!j)return;
  try{
    if(!downloads)downloads=await claude.use('downloads');
    if(!downloads){alert('Downloads are not available in this view.');return}
    const name=j.title.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'journal';
    await downloads.save({filename:name+'.pdf',data:toBlob(j.pdf)});
  }catch(e){console.error(e)}
}

/* ---------- Admin (platform-enforced: only the owner/editors can publish) ---------- */
function lockUI(msg){
  $('admin').innerHTML='<div class="panel lock"><h2>🔒 Admin only</h2><p class="note">'+msg+'</p><button class="alt" id="hideAdmin">Close</button></div>';
  $('hideAdmin').onclick=()=>{$('admin').innerHTML=''};
}
function panelUI(){
  $('admin').innerHTML=`<div class="panel"><h2>Admin: upload a journal (PDF only)</h2>
  <input type="text" id="t" placeholder="Title" maxlength="120">
  <input type="date" id="dt">
  <textarea id="ds" rows="2" placeholder="Short description" maxlength="300"></textarea>
  <input type="text" id="cat" placeholder="Category (e.g. Travel, Thoughts)" maxlength="40">
  <label class="note" for="cv">Cover image (optional, JPG/PNG, max 300 KB)</label>
  <input type="file" id="cv" accept="image/jpeg,image/png">
  <input type="file" id="f" accept="application/pdf,.pdf">
  <div class="row"><button id="up">Upload &amp; publish</button><button class="alt" id="hideAdmin">Close</button></div>
  <div class="note" id="msg">Max 5 MB per PDF. Publishing updates the site for every visitor.</div></div>`;
  $('dt').value=new Date().toISOString().slice(0,10);
  $('hideAdmin').onclick=()=>{$('admin').innerHTML=''};
  $('up').onclick=upload;
}
$('adminLink').onclick=async()=>{
  $('admin').scrollIntoView({behavior:'smooth'});
  try{
    const user=await claude.use('user');
    isAdmin=!!(user&&user.canEdit());
    artifact=isAdmin?await claude.use('artifact'):null;
  }catch(e){isAdmin=false}
  if(isAdmin&&artifact){panelUI()}else{isAdmin=false;lockUI('Sign in to your claude.ai account as the owner of this site to manage journals. Visitors cannot upload, edit or delete anything.')}
  render();
};

async function upload(){
  const f=$('f').files[0],t=$('t').value.trim(),m=$('msg');
  if(!t||!f){m.textContent='Please add a title and choose a PDF.';return}
  if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){m.textContent='Only PDF files are allowed.';return}
  if(f.size>MAX_FILE){m.textContent='That PDF is over 5 MB.';return}
  const buf=new Uint8Array(await f.arrayBuffer());
  if(String.fromCharCode(...buf.slice(0,4))!=='%PDF'){m.textContent='That file is not a valid PDF.';return}
  let s='';for(let i=0;i<buf.length;i+=8192)s+=String.fromCharCode(...buf.subarray(i,i+8192));
  const pdf=btoa(s);
  if(JSON.stringify(journals).length+pdf.length>MAX_TOTAL){m.textContent='Site storage is full. Delete an older journal first.';return}
  let cover='';const c=$('cv').files[0];
  if(c){if(!/^image\/(jpeg|png)$/.test(c.type)||c.size>307200){m.textContent='Cover must be a JPG/PNG under 300 KB.';return}
    cover=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(c)})}
  journals.unshift({id:'j'+Date.now().toString(36),title:t,date:$('dt').value,desc:$('ds').value.trim(),cat:$('cat').value.trim(),cover,pdf});
  m.textContent='Publishing…';save();
}

async function save(){
  if(!isAdmin||!artifact)return;
  try{
    const clone=document.documentElement.cloneNode(true);
    clone.querySelector('#data').textContent=JSON.stringify(journals).replace(/</g,'\\u003c');
    clone.querySelector('#admin').innerHTML='';
    clone.querySelector('#list').innerHTML='';
    clone.querySelector('#chips').innerHTML='';
    clone.removeAttribute('data-theme');
    clone.querySelector('#q').removeAttribute('value');
    clone.querySelector('#vf').removeAttribute('src');
    await artifact.publish('<!doctype html>\n'+clone.outerHTML);
  }catch(e){console.error(e);alert('Could not publish: '+(e&&e.message||e))}
}
render();
})();
</script>
</body>
</html>
